[package]
name = "github-webhook"
version = "0.1.2"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
once_cell = "1.18"
syslog = "7.0"
log = "0.4"

